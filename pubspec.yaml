name: jiburo_app
description: "jiburo Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.8
  lottie: ^3.3.2
  # toast 팝업
  fluttertoast: ^9.0.0
  # 앱 알림, 지도등 허가요청
  permission_handler: ^12.0.1
  # 카카오맵
  kakao_map_sdk: ^1.2.5
  # 카카오 sdk 설정 패키지
  kakao_flutter_sdk_common: ^1.10.0
  # 웹뷰 패키지
  flutter_inappwebview: ^6.1.5
  # 위치 확인 패키지
  geolocator: ^14.0.2
  # 나침반
  flutter_compass: ^0.8.1
  # 초기진입 스플래쉬 설정
  flutter_native_splash: ^2.4.7
  # 라우터 설정
  go_router: ^17.1.0
  # api 설정
  dio: ^5.9.2
  http: ^1.6.0
  # 상태관리
  flutter_riverpod: ^3.3.1

flutter_native_splash:
  image: assets/images/logos/Logo-Vertical.png
  color: "#FFFFFF"
  android: true
  ios: true

  # 사이즈 조절
  android_gravity: center
  ios_content_mode: center
  fullscreen: true  # 전체화면

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/icons/
    - assets/images/icons/tab-bar/
    - assets/images/logos/
    - assets/lottie/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400